server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/v1/voice/ {
        include /etc/nginx/voice-api.inc;
    }
    location = /api/v1/dashboard/runtime {
        include /etc/nginx/voice-api.inc;
    }
    # Never expose global settings or serve index.html for an unknown API.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"unsupported_product_api"}';
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
